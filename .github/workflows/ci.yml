name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: cv-screener/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (py compile)
        working-directory: cv-screener/backend
        run: python -m compileall app tests
      - name: Run tests
        working-directory: cv-screener/backend
        run: pytest tests/ -v
      - name: Check migrations compile
        working-directory: cv-screener/backend
        run: python -c "from app.db.session import Base; import app.models; print('models ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cv-screener/frontend/package.json
      - name: Install frontend deps
        working-directory: cv-screener/frontend
        run: npm ci
      - name: Lint
        working-directory: cv-screener/frontend
        run: npm run lint --if-present || npx tsc --noEmit
      - name: Build
        working-directory: cv-screener/frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        working-directory: cv-screener
        run: docker build -t cv-screener-backend:test ./backend
      - name: Verify non-root
        run: docker run --rm cv-screener-backend:test whoami | grep -q appuser
